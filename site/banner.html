<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel — banner</title>

<!--
  The Kestrel announcement strip, as a static layout.

  No JavaScript and no animation: the whole banner is one <header> and a
  stylesheet, so it can be pasted into a page, a Jekyll layout or a README
  preview without carrying a runtime.

  Fonts are requested from Google Fonts but every rule falls back to a system
  stack, so the layout is intact before they load and if they never do. To go
  fully self-hosted, drop the two <link> tags and the families will resolve to
  the fallbacks.

  Colours are the ones the operating system itself draws with, taken from
  kernel/src/desktop.rs, so the site and the running desktop match.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">

<style>
  :root {
    --kx-ink:       #0a1526;  /* deepest background          */
    --kx-mid:       #10233d;
    --kx-lift:      #1b3a63;  /* lit edge of the gradient    */
    --kx-accent:    #8ecdff;  /* the desktop's title-bar blue */
    --kx-bright:    #eaf4ff;
    --kx-text:      #9db4d0;
    --kx-muted:     #7f9ab8;  /* 6.29:1 on --kx-ink, passes AA */
    --kx-faint:     #4a5f7d;  /* decorative only, never text  */

    --kx-display: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif;
    --kx-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--kx-ink);
    font-family: var(--kx-display);
    padding: 40px 24px;
  }

  .kx-banner {
    position: relative;
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 18px;
    background: radial-gradient(120% 220% at 12% 50%,
                var(--kx-lift) 0%, var(--kx-mid) 42%, var(--kx-ink) 100%);
    box-shadow: 0 30px 80px -40px #000,
                inset 0 0 0 1px rgba(142, 205, 255, .14);
  }

  /* Faint engineering grid, faded out towards the right so it never competes
     with the text sitting over it. */
  .kx-grid {
    position: absolute;
    inset: 0;
    opacity: .5;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(142, 205, 255, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(142, 205, 255, .07) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(80% 140% at 20% 50%, #000 20%, transparent 78%);
            mask-image: radial-gradient(80% 140% at 20% 50%, #000 20%, transparent 78%);
  }

  /* A single row that becomes a stack when there is no room for one. */
  .kx-inner {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 28px 48px;
    min-height: 200px;
    padding: 28px clamp(20px, 3vw, 44px);
  }

  .kx-identity { display: flex; align-items: center; gap: 26px; }

  .kx-mark {
    width: 88px;
    height: 88px;
    flex: none;
    display: block;
    border-radius: 20px;
    box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .85),
                0 0 0 1px rgba(142, 205, 255, .22);
  }

  .kx-words { display: flex; flex-direction: column; gap: 9px; }

  .kx-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }

  .kx-title {
    font-size: clamp(34px, 4vw, 50px);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--kx-bright);
  }

  .kx-badge {
    font-family: var(--kx-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #9fd4ff;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(142, 205, 255, .35);
    background: rgba(142, 205, 255, .10);
    white-space: nowrap;
  }

  .kx-tagline {
    font-size: clamp(16px, 1.5vw, 20px);
    font-weight: 500;
    color: var(--kx-text);
  }

  .kx-aside { display: flex; align-items: center; flex-wrap: wrap; gap: 24px 40px; }

  .kx-facts {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-family: var(--kx-mono);
    font-size: 13px;
  }

  /* The command line. Static, but still a real <code> element so it can be
     selected and copied — which is the entire point of showing it. */
  .kx-command { display: flex; align-items: center; gap: 9px; }
  .kx-prompt { color: var(--kx-muted); user-select: none; }
  .kx-code { color: #cfe9ff; }

  .kx-stack { display: flex; gap: 16px; color: var(--kx-muted); letter-spacing: .05em; }
  .kx-sep { color: var(--kx-faint); }

  .kx-cta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 15px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    color: #08121f;
    background: linear-gradient(180deg, #a9dbff, #6fbdf5);
    box-shadow: 0 12px 30px -12px rgba(111, 189, 245, .8),
                inset 0 1px 0 rgba(255, 255, 255, .55);
  }

  .kx-cta:hover { background: linear-gradient(180deg, #c3e6ff, #8acbf8); }
  .kx-cta:focus-visible { outline: 2px solid var(--kx-accent); outline-offset: 3px; }

  .kx-cta-label { font-family: var(--kx-mono); font-size: 13px; letter-spacing: .06em; }
  .kx-cta-arrow { opacity: .6; }

  /* Below this the row would be cramped rather than balanced, so the two
     halves stack and align left together. */
  @media (max-width: 900px) {
    .kx-inner { justify-content: flex-start; }
    .kx-aside { width: 100%; }
  }

  @media (max-width: 520px) {
    .kx-identity { gap: 18px; }
    .kx-mark { width: 64px; height: 64px; border-radius: 15px; }
  }
</style>
</head>
<body>

<header class="kx-banner">
  <div class="kx-grid" aria-hidden="true"></div>

  <div class="kx-inner">
    <div class="kx-identity">
      <img class="kx-mark" src="kestrel-256.png"
           alt="Kestrel logo: a stooping falcon" width="88" height="88">

      <div class="kx-words">
        <div class="kx-title-row">
          <h1 class="kx-title">Kestrel</h1>
          <span class="kx-badge">v0.9.0 beta</span>
        </div>
        <p class="kx-tagline">An operating system, written from scratch</p>
      </div>
    </div>

    <div class="kx-aside">
      <div class="kx-facts">
        <div class="kx-command">
          <span class="kx-prompt" aria-hidden="true">$</span>
          <code class="kx-code">cargo xtask run</code>
        </div>
        <div class="kx-stack">
          <span>rust</span>
          <span class="kx-sep" aria-hidden="true">/</span>
          <span>no_std</span>
          <span class="kx-sep" aria-hidden="true">/</span>
          <span>x86-64</span>
        </div>
      </div>

      <a class="kx-cta" href="https://github.com/AverageCodeNerd/Kestrel">
        <span class="kx-cta-label">GITHUB</span>
        <span class="kx-cta-arrow" aria-hidden="true">&#8599;</span>
      </a>
    </div>
  </div>
</header>

</body>
</html>
