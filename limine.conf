# Copied to EFI/BOOT/limine.conf when the ESP is assembled. Limine looks for
# it next to its own EFI executable first.

timeout: 0
verbose: yes
serial: yes

/Kestrel
    protocol: limine
    path: boot():/boot/kestrel

    # User programs, handed to the kernel as modules so they are available
    # even when booting from media it has no driver for, such as a CD.
    module_path: boot():/bin/hello
    module_path: boot():/bin/fault
    module_path: boot():/bin/selfmod
    module_path: boot():/bin/edit
    module_path: boot():/bin/snake


