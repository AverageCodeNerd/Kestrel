# Copied to EFI/BOOT/limine.conf when the ESP is assembled. Limine looks for
# it next to its own EFI executable first.

# Long enough to choose the previous kernel after a bad update, short enough
# not to be in the way. Kestrel can replace its own kernel from inside itself,
# and this menu is what makes that recoverable rather than final.
timeout: 3
verbose: yes
serial: yes

# Ask the firmware for 1080p. The desktop is drawn in software at whatever
# size it is given, and the font is a fixed 8x16, so this is what decides how
# much fits on screen rather than how large anything looks - Kestrel picks its
# own text scale from the mode it ends up with.
#
# A request, not a demand: Limine falls back to the best mode the firmware
# actually offers, which is why there is no matching fallback here. Some
# firmware (VirtualBox's in particular) offers a short list that may not
# include this one.
resolution: 1920x1080x32

/Kestrel
    protocol: limine
    path: boot():/boot/kestrel

    # The repository, handed to the kernel as modules so it exists on any
    # medium the kernel can boot from, including a CD it cannot write to.
    # These are packages available to install, not installed programs.
    module_path: boot():/repo/hello
    module_path: boot():/repo/fault
    module_path: boot():/repo/selfmod
    module_path: boot():/repo/edit
    module_path: boot():/repo/snake
    module_path: boot():/repo/paint
    module_path: boot():/repo/basic
    module_path: boot():/repo/catalogue

# Written by `update install` before it replaces the kernel above. On a fresh
# install this entry points at a file that does not exist yet and simply fails
# to boot, which is the correct behaviour: there is nothing to go back to.
/Kestrel (previous kernel)
    protocol: limine
    path: boot():/boot/kestrel.old

    module_path: boot():/repo/hello
    module_path: boot():/repo/fault
    module_path: boot():/repo/selfmod
    module_path: boot():/repo/edit
    module_path: boot():/repo/snake
    module_path: boot():/repo/paint
    module_path: boot():/repo/basic
    module_path: boot():/repo/catalogue

